name: Sync achievement news

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-achievement-news-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate achievement news
        env:
          BEFORE_SHA: ${{ github.event.before }}
          COMMIT_DATE: ${{ github.event.head_commit.timestamp }}
        run: |
          if [ -z "$BEFORE_SHA" ]; then
            BEFORE_SHA="HEAD^"
          fi
          python tools/sync_achievement_news.py \
            --before "$BEFORE_SHA" \
            --commit-date "$COMMIT_DATE"

      - name: Commit generated news
        run: |
          if git diff --quiet -- news.json; then
            echo "No achievement news changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Auto-generate achievement news [skip ci]"
          git push origin HEAD:main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
